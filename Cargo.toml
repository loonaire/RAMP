[package]
name = "ramp"
version = "0.4.0"
edition = "2021"
description = "RAMP Control Panel: Apache, MariaDB, PHP and phpMyAdmin on Windows, in Rust + Slint (no Windows services)"

[dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"
# No system-tray, a single renderer: the software one needs no OpenGL (VMs, RDP).
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "unstable-winit-030"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem"] }
# Inflate only: "deflate" would also build the zopfli compressor.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
slint-build = "1.18"

[profile.release]
strip = true
lto = true

[profile.dev]
debug = 0

# Dependencies optimised in debug builds too: the unoptimised software renderer
# takes 300-500 ms to paint a window, a black window at every opening under
# `cargo run`. RAMP's own code stays unoptimised.
[profile.dev.package."*"]
opt-level = 2
