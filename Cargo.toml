[package]
name = "ramp"
version = "0.3.0"
edition = "2021"
description = "RAMP Control Panel: modern Rust + Slint rewrite of the XAMPP Control Panel (Apache + MySQL only, no Windows services)"

[dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"
slint = "1.18"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Environment", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
slint-build = "1.18"

[profile.release]
strip = true
lto = true

[profile.dev]
debug = 0
