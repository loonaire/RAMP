#
# RAMP settings (file name kept as httpd-xampp.conf: the panel's compatibility
# patches look it up under that name)
#

<IfModule env_module>
    SetEnv MIBDIRS "@ROOT@/php/extras/mibs"
    SetEnv MYSQL_HOME "@ROOTBS@\\mysql\\bin"
    SetEnv OPENSSL_CONF "@ROOT@/apache/bin/openssl.cnf"
    SetEnv PHP_PEAR_SYSCONF_DIR "@ROOTBS@\\php"
    SetEnv PHPRC "@ROOTBS@\\php"
    SetEnv TMP "@ROOTBS@\\tmp"
</IfModule>

#
# PHP-Module setup
#
LoadFile "@ROOT@/php/@PHPRT@.dll"
LoadFile "@ROOT@/php/libpq.dll"
LoadFile "@ROOT@/php/libsqlite3.dll"
LoadModule php_module "@ROOT@/php/@PHPMOD@.dll"

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>
<FilesMatch "\.phps$">
    SetHandler application/x-httpd-php-source
</FilesMatch>

#
# PHP-CGI setup
#
#<FilesMatch "\.php$">
#    SetHandler application/x-httpd-php-cgi
#</FilesMatch>
#<IfModule actions_module>
#    Action application/x-httpd-php-cgi "/php-cgi/php-cgi.exe"
#</IfModule>


<IfModule php_module>
# patched by the control panel updater: PHPINIDir crashes the
# httpd worker (0xC0000005) with PHP >= 8.5 mod_php. The panel exports
# PHPRC into the httpd process environment at start instead.
#    PHPINIDir "@ROOT@/php"
</IfModule>

<IfModule mime_module>
    AddType text/html .php .phps
</IfModule>

# No /php-cgi/ alias: PHP runs as mod_php, and an alias that opens php-cgi.exe
# to the network is the CVE-2024-4577 entry point. The PHP-CGI setup above needs
# one (ScriptAlias /php-cgi/ "@ROOT@/php/") if it is ever switched back on.

<Directory "@ROOT@/cgi-bin">
    <FilesMatch "\.php$">
        SetHandler cgi-script
    </FilesMatch>
    <FilesMatch "\.phps$">
        SetHandler None
    </FilesMatch>
</Directory>

<IfModule alias_module>
    # Lower-case alias: Apache on Windows resolves it case-insensitively, but the
    # URL users type is always /phpmyadmin.
    Alias /phpmyadmin "@ROOT@/phpMyAdmin/"
    <Directory "@ROOT@/phpMyAdmin">
        AllowOverride AuthConfig
        Require local
    </Directory>
</IfModule>
